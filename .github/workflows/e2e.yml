name: e2e

on:
  pull_request:
    paths:
      - compose/ai.yml
      - compose/pipeline.yml
      - compose/base-compose.yml
      - config/job-controller/**
      - config/delta/**
      - config/ner/**
      - config/nel/**
      - config/pdf-content/**
      - config/annotation-job-splitter/**
      - docker-compose.e2e.yml
      - tests/e2e/**
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -p app-decide-e2e -f docker-compose.yml -f docker-compose.e2e.yml
  SERVICES: >-
    virtuoso database deltanotifier migrations job-controller
    harvest_singleton-job annotation-job-splitter pdf-scraper pdf-content
    apache-tika named-entity-recognition entity-linking ollama

jobs:
  pipeline:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7

      - name: Check the Mistral secret
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: test -n "$MISTRAL_API_KEY" || { echo "::error::Repository secret MISTRAL_API_KEY is not set"; exit 1; }

      - name: Generate the e2e NER config
        run: python3 tests/e2e/make_ner_config.py

      - name: Start the pipeline stack
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: $COMPOSE up -d $SERVICES

      - name: Run the pipeline test
        run: python3 tests/e2e/run_pipeline_test.py

      - name: Dump service logs on failure
        if: failure()
        run: $COMPOSE logs --no-color $SERVICES

      - name: Tear down the stack
        if: always()
        run: $COMPOSE down -v

      - name: Report disk usage
        if: always()
        run: df -h /
