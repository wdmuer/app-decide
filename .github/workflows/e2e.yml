name: e2e

on:
  pull_request:
    paths:
      - compose/**
      - docker-compose.yml
      - docker-compose.e2e.yml
      - config/virtuoso/**
      - config/authorization/**
      - config/migrations/**
      - config/delta/**
      - config/job-controller/**
      - config/annotation-job-splitter/**
      - config/pdf-content/**
      - config/ner/**
      - config/nel/**
      - tests/e2e/**
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -p app-decide-e2e -f docker-compose.yml -f docker-compose.e2e.yml
  SERVICES: >-
    virtuoso database deltanotifier migrations job-controller
    harvest_singleton-job annotation-job-splitter pdf-scraper pdf-content
    apache-tika named-entity-recognition entity-linking ollama

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether a pipeline service changed
        id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          decide() { echo "$1"; echo "run=$2" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = pull_request ] || decide "Manual run" true
          other=$(git diff --name-only "$BASE" HEAD | grep -v -E '^(compose/|docker-compose\.yml$)' || true)
          [ -z "$other" ] || decide "Changed outside the compose files: $other" true
          # Hashes contain absolute paths, so both sides are computed in this same checkout.
          hashes() { $COMPOSE config --hash "${SERVICES// /,}" | sort; }
          head_hashes=$(hashes)
          git checkout -q "$BASE"
          base_hashes=$(hashes) || decide "Could not hash the base, running to be safe" true
          [ "$head_hashes" != "$base_hashes" ] || decide "No pipeline service changed" false
          diff <(echo "$base_hashes") <(echo "$head_hashes") | grep '^>' || true
          decide "Pipeline services changed" true

  pipeline:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7

      - name: Check the Mistral secret
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: test -n "$MISTRAL_API_KEY" || { echo "::error::Repository secret MISTRAL_API_KEY is not set"; exit 1; }

      - name: Generate the e2e NER config
        run: python3 tests/e2e/make_ner_config.py

      - name: Start the pipeline stack
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: $COMPOSE up -d $SERVICES

      - name: Run the pipeline test
        run: python3 tests/e2e/run_pipeline_test.py

      - name: Dump service logs on failure
        if: failure()
        run: $COMPOSE logs --no-color $SERVICES

      - name: Tear down the stack
        if: always()
        run: $COMPOSE down -v

      - name: Report disk usage
        if: always()
        run: df -h /
